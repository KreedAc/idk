<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Terminal RPG — La Cripta del Drago</title>
<style>
  :root {
    --bg: #0e0c14; --panel: #1a1726; --panel2: #241f33;
    --accent: #c9a45c; --accent2: #7b5cff; --text: #e8e3d8; --muted: #9a93a8;
    --hp: #ff7b76; --mana: #79a8ff; --xp: #c9a45c;
    --good: #5fae62; --bad: #d6453f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at 50% 0%, #1c1730 0%, var(--bg) 70%);
    color: var(--text); font-family: "Georgia", "Times New Roman", serif;
    min-height: 100dvh; display: flex; justify-content: center; padding: 10px;
  }
  #app { width: 100%; max-width: 480px; }
  h1, h2, h3 { font-family: "Georgia", serif; margin: 0.2em 0; }
  .title { text-align: center; color: var(--accent); letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(201,164,92,0.4); }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 18px; }
  .panel { background: var(--panel); border: 1px solid #322b45; border-radius: 10px;
    padding: 16px; margin-bottom: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.4); }
  .room-name { color: var(--accent); border-bottom: 1px solid #322b45; padding-bottom: 6px; }
  .room-desc { color: var(--muted); font-style: italic; margin: 10px 0; }
  button {
    font-family: inherit; font-size: 15px; background: var(--panel2); color: var(--text);
    border: 1px solid #3d3551; border-radius: 8px; padding: 11px 14px; margin: 4px 0;
    cursor: pointer; width: 100%; text-align: left; transition: all 0.12s ease;
  }
  button:hover:not(:disabled) { background: #2f2842; border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: linear-gradient(135deg, #4a3a7a, #2f2550); border-color: var(--accent2); text-align: center; }
  button.danger { border-color: #5a2f33; }
  button.small { width: auto; padding: 7px 12px; font-size: 14px; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  input[type=text] { font-family: inherit; font-size: 16px; background: #0f0d16; color: var(--text);
    border: 1px solid #3d3551; border-radius: 8px; padding: 10px; width: 100%; margin: 6px 0; }
  /* Barre nemico (in combattimento) */
  .bar { height: 14px; background: #0f0d16; border-radius: 7px; overflow: hidden; border: 1px solid #2a2438; }
  .bar > div { height: 100%; transition: width 0.3s ease; }
  .bar.enemy > div { background: linear-gradient(90deg, #6a2f6a, #b04ab0); }
  .bar-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  /* Vitali e statistiche */
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .vitals { display: flex; flex-wrap: wrap; gap: 14px; font-size: 18px; margin-top: 6px; }
  .vital { white-space: nowrap; }
  .vital.hp { color: var(--hp); } .vital.mana { color: var(--mana); } .vital.oro { color: var(--accent); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 14px; }
  .stats span { color: var(--accent); } .stats small { color: var(--muted); font-size: 12px; }
  .tag { font-size: 12px; padding: 2px 6px; border-radius: 4px; background: #2a2438; color: var(--muted); }
  .tag.fx-veleno { background: #2a4a2a; color: #9fe09f; }
  .tag.fx-stordito { background: #4a4520; color: #e0d49f; }
  .tag.fx-rigenerazione { background: #204a45; color: #9fe0d4; }
  .tag.fx-forza { background: #4a2a20; color: #e0b09f; }
  .delta-up { color: var(--good); font-weight: bold; } .delta-down { color: var(--bad); font-weight: bold; }
  .delta-eq { color: var(--muted); }
  .equipped { color: var(--good); }
  #log { background: #0a0810; border: 1px solid #2a2438; border-radius: 8px; padding: 12px;
    height: 150px; overflow-y: auto; font-size: 14px; line-height: 1.5; margin-bottom: 4px; }
  #log p { margin: 3px 0; }
  .log-good { color: var(--good); } .log-bad { color: var(--bad); }
  .log-crit { color: var(--accent); font-weight: bold; } .log-sys { color: var(--accent2); }
  .combatant { display: flex; justify-content: space-between; align-items: baseline; }
  .combatant .name { font-weight: bold; }
  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 10px; }
  .item-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; }
  .item-row button { width: auto; }
  .sprite { text-align: center; font-size: 58px; line-height: 1.1; margin: 6px 0; }
  /* App shell stile telefono */
  .appshell { display: flex; flex-direction: column; height: calc(100vh - 20px); height: calc(100dvh - 20px); }
  .appheader { background: var(--panel); border: 1px solid #322b45; border-radius: 10px; padding: 12px 16px; }
  .appmain { flex: 1 1 auto; overflow-y: auto; margin-top: 10px; padding-right: 2px; }
  .appnav { display: flex; gap: 6px; margin-top: 8px; }
  .appnav button { flex: 1; width: auto; text-align: center; padding: 8px 2px; font-size: 11px; line-height: 1.4; margin: 0; }
  .appnav button .ic { font-size: 20px; display: block; }
  .appnav button.active { border-color: var(--accent); color: var(--accent); background: #2f2842; }
  /* Sacche zaino */
  .pouchbtn { display: flex; align-items: center; gap: 14px; font-size: 16px; padding: 14px; }
  .pouchbtn .big { font-size: 30px; }
  /* Pop-up (bottom sheet) */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.62); display: flex;
    align-items: flex-end; justify-content: center; z-index: 50; }
  .modal { background: var(--panel); border: 1px solid #3d3551; border-radius: 16px 16px 0 0;
    width: 100%; max-width: 480px; max-height: 82vh; overflow-y: auto; padding: 18px;
    animation: slideup 0.2s ease; }
  @keyframes slideup { from { transform: translateY(40px); opacity: 0.4; } to { transform: translateY(0); opacity: 1; } }
  /* Animazioni combattimento */
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)}
    40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
  #app.shake { animation: shake 0.3s ease; }
  @keyframes lunge { 0%{transform:scale(1)} 30%{transform:scale(1.25) rotate(-6deg)} 100%{transform:scale(1)} }
  .sprite.lunge { animation: lunge 0.3s ease; }
  @keyframes pop { 0%{transform:scale(0.6);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .pop { animation: pop 0.4s ease; }
  /* Mini-mappa */
  .map { display: grid; gap: 4px; justify-content: center; margin: 8px 0; }
  .map .cell { width: 40px; height: 40px; border-radius: 6px; display: flex; align-items: center;
    justify-content: center; font-size: 19px; background: #120f1c; border: 1px solid #221c30; }
  .map .cell.visited { background: #221c30; border-color: #3d3551; }
  .map .cell.current { background: #3a2d5e; border-color: var(--accent); box-shadow: 0 0 8px rgba(201,164,92,0.5); }
  .map .cell.known { color: var(--muted); border-style: dashed; }
  .map .cell.empty { background: transparent; border-color: transparent; }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

// ============================================================
//  AUDIO
// ============================================================
let audioCtx = null;
let audioOn = localStorage.getItem("rpg_audio") !== "off";
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, dur, type = "square", vol = 0.14, when = 0) {
  if (!audioOn) return;
  try {
    const c = ac(); const o = c.createOscillator(); const g = c.createGain();
    o.type = type; o.frequency.value = freq; o.connect(g); g.connect(c.destination);
    const t = c.currentTime + when;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function sfx(name) {
  if (!audioOn) return;
  switch (name) {
    case "hit": tone(200, 0.08, "square", 0.12); break;
    case "crit": tone(380, 0.07, "sawtooth", 0.16); tone(280, 0.12, "sawtooth", 0.12, 0.05); break;
    case "hurt": tone(110, 0.18, "square", 0.14); break;
    case "heal": tone(500, 0.1, "sine", 0.12); tone(720, 0.14, "sine", 0.12, 0.08); break;
    case "coin": tone(880, 0.05, "square", 0.1); tone(1180, 0.07, "square", 0.1, 0.05); break;
    case "magic": tone(300, 0.2, "sine", 0.12); tone(620, 0.25, "sine", 0.1, 0.06); break;
    case "poison": tone(150, 0.16, "square", 0.09); break;
    case "level": [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, "triangle", 0.12, i * 0.09)); break;
    case "victory": [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.16, "triangle", 0.13, i * 0.11)); break;
    case "defeat": [400, 330, 260, 180].forEach((f, i) => tone(f, 0.22, "sawtooth", 0.12, i * 0.14)); break;
  }
}
function toggleAudio() {
  audioOn = !audioOn;
  localStorage.setItem("rpg_audio", audioOn ? "on" : "off");
  if (audioOn) sfx("coin");
  rerender();
}

// ============================================================
//  DATI DI GIOCO
// ============================================================
function item(nome, tipo, opts = {}) {
  return Object.assign({ nome, tipo, cura: 0, bonus: 0, valore: 0 }, opts);
}
const ITEMS = {
  pozMinore:   item("Pozione Minore", "pozione", { cura: 12, valore: 10 }),
  pozMaggiore: item("Pozione Maggiore", "pozione", { cura: 30, valore: 25 }),
  antidoto:    item("Antidoto", "pozione", { cura: 6, valore: 12 }),
  spada:       item("Spada Arrugginita", "arma", { bonus: 2, valore: 15 }),
  ascia:       item("Ascia da Guerra", "arma", { bonus: 5, valore: 40 }),
  pugnale:     item("Pugnale d'Ombra", "arma", { bonus: 4, valore: 35 }),
  lama:        item("Lama del Cacciatore", "arma", { bonus: 6, valore: 60 }),
  cuoio:       item("Corazza di Cuoio", "armatura", { bonus: 2, valore: 15 }),
  maglia:      item("Cotta di Maglia", "armatura", { bonus: 4, valore: 40 }),
  mantello:    item("Mantello Arcano", "armatura", { bonus: 5, valore: 65 }),
  amuleto:     item("Amuleto Perduto", "tesoro", { valore: 0 }),
  chiave:      item("Chiave del Drago", "tesoro", { valore: 0 }),
};
// Ogni classe ha una risorsa a tema (stessa meccanica, nome/emoji diversi).
const CLASSI = {
  Guerriero: { pv: 30, attacco: 8, difesa: 5, mana: 8, abilita: "Colpo Poderoso",
    moltAbilita: 1.8, emoji: "🛡️", risorsa: { nome: "Vigore", emoji: "💪" },
    descrizione: "Robusto; può stordire i nemici." },
  Mago:      { pv: 20, attacco: 11, difesa: 2, mana: 16, abilita: "Palla di Fuoco",
    moltAbilita: 2.2, emoji: "🔮", risorsa: { nome: "Mana", emoji: "🔮" },
    descrizione: "Fragile ma incendia i nemici." },
  Ladro:     { pv: 24, attacco: 9, difesa: 3, mana: 10, abilita: "Colpo Furtivo",
    moltAbilita: 2.0, emoji: "🗡️", risorsa: { nome: "Energia", emoji: "⚡" },
    descrizione: "Critici frequenti e ferite sanguinanti." },
};
function risorsa(p) { return CLASSI[p.classe].risorsa; }

function nemico(nome, emoji, pv, attacco, difesa, xp, opts = {}) {
  return { nome, emoji, pvMax: pv, pv, attacco, difesa, xp,
    drop: opts.drop || null, inflitto: opts.inflitto || null, effetti: [] };
}
const NEMICI = {
  ratto:     () => nemico("Ratto Gigante", "🐀", 12, 4, 1, 8),
  slime:     () => nemico("Melma Acida", "🟢", 16, 4, 2, 12, { inflitto: { tipo: "veleno", prob: 0.35, turni: 2, valore: 2 } }),
  ragno:     () => nemico("Ragno Velenoso", "🕷️", 18, 5, 2, 16, { drop: "pozMinore", inflitto: { tipo: "veleno", prob: 0.55, turni: 3, valore: 2 } }),
  goblin:    () => nemico("Goblin", "👺", 20, 6, 2, 14, { drop: "pozMinore" }),
  scheletro: () => nemico("Scheletro", "💀", 24, 7, 3, 20, { drop: "spada" }),
  mago:      () => nemico("Mago Oscuro", "🧙", 22, 9, 2, 30, { drop: "pozMaggiore", inflitto: { tipo: "stordito", prob: 0.35, turni: 1, valore: 0 } }),
  orco:      () => nemico("Orco Brutale", "👹", 36, 10, 4, 35, { drop: "maglia" }),
  drago:     () => nemico("Drago Antico", "🐉", 80, 15, 8, 120, { drop: "pozMaggiore", inflitto: { tipo: "veleno", prob: 0.45, turni: 3, valore: 4 } }),
};
const MONDO = {
  ingresso:    { nome: "Ingresso della Cripta", emoji: "🚪", x: 2, y: 4,
    desc: "Una soglia di pietra umida. Un vecchio incappucciato ti osserva.",
    uscite: { nord: "corridoio" }, npc: "anziano" },
  corridoio:   { nome: "Corridoio Stretto", emoji: "🕯️", x: 2, y: 3,
    desc: "Torce tremolanti. Bivi si aprono a ovest, est e nord.",
    uscite: { sud: "ingresso", ovest: "cella", est: "segreta", nord: "accampamento" }, nemico: "ratto" },
  cella:       { nome: "Vecchia Cella", emoji: "🔒", x: 1, y: 3,
    desc: "Una cella abbandonata. Una melma ribolle nell'angolo.",
    uscite: { est: "corridoio" }, nemico: "slime", bottino: ["spada", "cuoio"] },
  segreta:     { nome: "Stanza Segreta", emoji: "💎", x: 3, y: 3,
    desc: "Una stanza nascosta. Un ragno gigante custodisce qualcosa di luccicante.",
    uscite: { ovest: "corridoio" }, nemico: "ragno", bottino: ["amuleto", "pozMinore"] },
  accampamento:{ nome: "Accampamento", emoji: "🏕️", x: 2, y: 2,
    desc: "Un rifugio sicuro illuminato da un falò. Un mercante ti fa cenno.",
    uscite: { sud: "corridoio", ovest: "sala", est: "laboratorio", nord: "cripta" }, npc: "mercante" },
  sala:        { nome: "Sala delle Colonne", emoji: "🏛️", x: 1, y: 2,
    desc: "Colonne spezzate. Un goblin ti ringhia contro.",
    uscite: { est: "accampamento", ovest: "armeria" }, nemico: "goblin" },
  armeria:     { nome: "Armeria Diroccata", emoji: "⚒️", x: 0, y: 2,
    desc: "Rastrelliere arrugginite. Uno scheletro monta ancora la guardia.",
    uscite: { est: "sala" }, nemico: "scheletro", bottino: ["ascia"] },
  laboratorio: { nome: "Laboratorio Arcano", emoji: "⚗️", x: 3, y: 2,
    desc: "Alambicchi e rune. Un mago oscuro intona un incantesimo.",
    uscite: { ovest: "accampamento", nord: "prigione" }, nemico: "mago", bottino: ["pozMaggiore"] },
  prigione:    { nome: "Prigione", emoji: "⛓️", x: 3, y: 1,
    desc: "Sbarre arrugginite. Un prigioniero ti chiama da una cella.",
    uscite: { sud: "laboratorio" }, npc: "prigioniero" },
  cripta:      { nome: "Cripta Profonda", emoji: "⚰️", x: 2, y: 1,
    desc: "Sarcofagi infranti. Un orco brutale emerge dall'ombra.",
    uscite: { sud: "accampamento", nord: "antro", ovest: "santuario" }, nemico: "orco", bottino: ["pozMaggiore"] },
  santuario:   { nome: "Santuario", emoji: "⛪", x: 1, y: 1,
    desc: "Un altare di luce calda emana pace. Puoi riposare qui.",
    uscite: { est: "cripta" }, npc: "altare" },
  antro:       { nome: "Antro del Drago", emoji: "🐉", x: 2, y: 0,
    desc: "Una caverna rovente. Sul cumulo d'oro si erge il Drago Antico.",
    uscite: { sud: "cripta" }, nemico: "drago", boss: true },
};
const QUESTS = {
  principale:  { nome: "L'Ombra del Drago", obiettivo: "Sconfiggi il Drago Antico nell'Antro, a nord della cripta. L'ingresso è sigillato: ti serve la Chiave del Drago." },
  amuleto:     { nome: "L'Amuleto del Mercante", obiettivo: "Trova l'Amuleto Perduto nella stanza segreta (est del corridoio) e portalo al mercante." },
  prigioniero: { nome: "Il Prigioniero", obiettivo: "Libera il prigioniero nella cella sopra il laboratorio: ti darà la Chiave del Drago." },
};
const NOMI_EFFETTO = { veleno: "Veleno", stordito: "Stordimento", rigenerazione: "Rigenerazione", forza: "Forza" };

// ============================================================
//  STATO
// ============================================================
let stato = null;
let combattimento = null;
let schermataAttuale = null;
let tabAttiva = "esplora";
let saccaAperta = null;     // null | "pozione" | "equip" | "missione"
let fxEnemy = false, fxShake = false;
const SAVE_KEY = "terminal_rpg_save_v3";
const app = () => document.getElementById("app");

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function categoria(it) { return it.tipo === "pozione" ? "pozione" : it.tipo === "tesoro" ? "missione" : "equip"; }
function descBreve(it) {
  if (it.tipo === "pozione") return `${it.nome} (cura ${it.cura} PV)`;
  if (it.tipo === "arma") return `${it.nome} (+${it.bonus} ATK)`;
  if (it.tipo === "armatura") return `${it.nome} (+${it.bonus} DIF)`;
  return it.nome;
}
function sommaEffetto(e, tipo) {
  return (e.effetti || []).filter(x => x.tipo === tipo).reduce((s, x) => s + x.valore, 0);
}
function attaccoTotale(p) { return p.attacco + (p.arma ? ITEMS[p.arma].bonus : 0) + sommaEffetto(p, "forza"); }
function difesaTotale(p) { return p.difesa + (p.armatura ? ITEMS[p.armatura].bonus : 0); }
// Differenza di valore rispetto all'oggetto equipaggiato nello stesso slot.
function deltaEquip(it) {
  if (it.tipo === "arma") return it.bonus - (stato.arma ? ITEMS[stato.arma].bonus : 0);
  if (it.tipo === "armatura") return it.bonus - (stato.armatura ? ITEMS[stato.armatura].bonus : 0);
  return 0;
}
function badgeDelta(it) {
  const d = deltaEquip(it);
  if (d > 0) return `<span class="delta-up">+${d}</span>`;
  if (d < 0) return `<span class="delta-down">${d}</span>`;
  return `<span class="delta-eq">=</span>`;
}

// ============================================================
//  LOG
// ============================================================
let logBuffer = [];
function log(testo, classe = "") {
  logBuffer.push({ testo, classe });
  if (logBuffer.length > 60) logBuffer.shift();
}
function renderLog() {
  const el = document.getElementById("log");
  if (!el) return;
  el.innerHTML = logBuffer.map(l => `<p class="${l.classe}">${l.testo}</p>`).join("");
  el.scrollTop = el.scrollHeight;
}

// ============================================================
//  EFFETTI DI STATO
// ============================================================
function applica(ent, tipo, turni, valore) {
  ent.effetti = ent.effetti || [];
  ent.effetti.push({ tipo, turni, valore });
}
function tagsEffetti(ent) {
  return (ent.effetti || []).map(e => {
    const v = e.tipo === "stordito" ? "" : ` ${e.valore}`;
    return `<span class="tag fx-${e.tipo}">${NOMI_EFFETTO[e.tipo]}${v} (${e.turni})</span>`;
  }).join(" ");
}
function processoInizio(ent, nome) {
  const msg = []; let stordito = false; const restanti = [];
  for (const ef of (ent.effetti || [])) {
    if (ef.tipo === "veleno") {
      ent.pv = Math.max(0, ent.pv - ef.valore);
      msg.push({ t: `${nome}: ${ef.valore} danni da veleno/bruciatura.`, c: "log-bad" });
      sfx("poison");
    } else if (ef.tipo === "rigenerazione") {
      const before = ent.pv; ent.pv = Math.min(ent.pvMax, ent.pv + ef.valore);
      msg.push({ t: `${nome}: rigeneri ${ent.pv - before} PV.`, c: "log-good" });
    } else if (ef.tipo === "stordito") {
      stordito = true; msg.push({ t: `${nome}: stordito, salta il turno!`, c: "log-sys" });
    }
    ef.turni -= 1;
    if (ef.turni > 0) restanti.push(ef);
    else if (ef.tipo === "forza") msg.push({ t: `${nome}: l'effetto Forza svanisce.`, c: "log-sys" });
  }
  ent.effetti = restanti;
  return { stordito, msg };
}

// ============================================================
//  COMPONENTI UI
// ============================================================
function rerender() { if (schermataAttuale) schermataAttuale(); }

function headerVitali() {
  const p = stato, r = risorsa(p);
  return `
    <div class="topbar">
      <span><b>${CLASSI[p.classe].emoji} ${p.nome}</b> <span class="tag">Lv.${p.livello}</span></span>
    </div>
    <div class="vitals">
      <span class="vital hp">♥️ ${p.pv}/${p.pvMax}</span>
      <span class="vital mana">${r.emoji} ${p.mana}/${p.manaMax}</span>
      <span class="vital oro">🪙 ${p.oro}</span>
    </div>
    ${(p.effetti && p.effetti.length) ? `<div style="margin-top:6px">${tagsEffetti(p)}</div>` : ""}`;
}

function navBar() {

function contenutoEsplora() {
  const stanza = MONDO[stato.stanza];
  const npcBtn = stanza.npc ? `<button class="primary" onclick="interagisciNpc()">${npcEtichetta(stanza.npc)}</button>` : "";
  let dirHtml = "";
  Object.keys(stanza.uscite).forEach(d => {
    const destKey = stanza.uscite[d];
    const dest = MONDO[destKey];
    const conosciuta = stato.visitate[destKey];
    const sigillata = destKey === "antro" && !stato.inventario.includes("chiave");
    const etichetta = (conosciuta || sigillata) ? `${dest.emoji} ${dest.nome}` : "???";
    dirHtml += `<button onclick="provaSpostamento('${destKey}')">
      ${frecce(d)} ${d[0].toUpperCase() + d.slice(1)}${sigillata ? " 🔒" : ""}<br>
      <span class="tag">${etichetta}</span></button>`;
  });
  return `
    <div class="panel">
      <h2 class="room-name">${stanza.emoji} ${stanza.nome}</h2>
      <p class="room-desc">${stanza.desc}</p>
      ${npcBtn}
    </div>
    <div class="panel">
      <h3 style="color:var(--muted); margin-top:0">Spostati</h3>
      <div class="btn-grid">${dirHtml}</div>
      ${renderMinimap()}
    </div>
    <div class="panel">
      <h3 style="color:var(--muted); margin-top:0">Diario di viaggio</h3>
      <div id="log"></div>
    </div>`;
}
function frecce(d) { return { nord: "⬆", sud: "⬇", est: "➡", ovest: "⬅" }[d] || "•"; }
function npcEtichetta(npc) {
  return { anziano: "🧙‍♂️ Parla con l'Anziano", mercante: "🧝 Visita il Mercante",
    prigioniero: "🧎 Avvicinati al prigioniero", altare: "✨ Riposa all'altare" }[npc] || "Interagisci";
}
function renderMinimap() {
  let maxX = 0, maxY = 0;
  for (const k in MONDO) { maxX = Math.max(maxX, MONDO[k].x); maxY = Math.max(maxY, MONDO[k].y); }
  const griglia = {};
  for (const k in MONDO) griglia[`${MONDO[k].x},${MONDO[k].y}`] = k;
  const note = {};
  for (const k in stato.visitate) for (const d in MONDO[k].uscite) note[MONDO[k].uscite[d]] = true;
  let html = `<div class="map" style="grid-template-columns: repeat(${maxX + 1}, 40px)">`;
  for (let y = 0; y <= maxY; y++) for (let x = 0; x <= maxX; x++) {
    const key = griglia[`${x},${y}`];
    if (!key) { html += `<div class="cell empty"></div>`; continue; }
    if (key === stato.stanza) html += `<div class="cell current">${MONDO[key].emoji}</div>`;
    else if (stato.visitate[key]) html += `<div class="cell visited">${MONDO[key].emoji}</div>`;
    else if (note[key]) html += `<div class="cell known">?</div>`;
    else html += `<div class="cell empty"></div>`;
  }
  return html + `</div>`;
}

function apriSacca(cat) { saccaAperta = cat; schermataGioco(); }

function overlaySacca(cat) {
  const p = stato;

function usaPozioneInv(i) {
  const p = stato, it = ITEMS[p.inventario[i]];
  if (p.pv >= p.pvMax) { log("Sei già al massimo dei PV.", "log-sys"); }
  const before = p.pv;
  p.pv = Math.min(p.pvMax, p.pv + it.cura);
  log(`Bevi ${it.nome} e recuperi ${p.pv - before} PV.`, "log-good"); sfx("heal");
  p.inventario.splice(i, 1);
  schermataGioco();
}
function equipaggiaInv(i) {
  const p = stato, k = p.inventario[i], it = ITEMS[k];
  if (it.tipo === "arma") {
    const prec = p.arma; p.arma = k; p.inventario.splice(i, 1);
    if (prec) p.inventario.push(prec);
    log(`Impugni ${it.nome}.`, "log-sys");
  } else if (it.tipo === "armatura") {
    const prec = p.armatura; p.armatura = k; p.inventario.splice(i, 1);
    if (prec) p.inventario.push(prec);
    log(`Indossi ${it.nome}.`, "log-sys");
  }
  schermataGioco();
}

function entraStanza() {
  tabAttiva = "esplora"; saccaAperta = null;
  stato.visitate[stato.stanza] = true;
  const stanza = MONDO[stato.stanza];
  if (stanza.nemico && !stato.ripulite[stato.stanza]) { iniziaCombattimento(stanza.nemico); return; }
  schermataGioco();
}
function provaSpostamento(destKey) {
  if (destKey === "antro" && !stato.inventario.includes("chiave")) {
    log("Una barriera magica sigilla l'Antro del Drago. Ti serve la Chiave del Drago: liberare il prigioniero potrebbe aiutarti.", "log-bad");
    schermataGioco();
    return;
  }
  stato.stanza = destKey;
  entraStanza();
}
function raccogliBottino() {
  const stanza = MONDO[stato.stanza];
  if (stanza.bottino && stanza.bottino.length && !stato.ripulite[stato.stanza]) {
    stanza.bottino.forEach(k => { stato.inventario.push(k); log(`Trovi: ${descBreve(ITEMS[k])}`, "log-good"); });
    sfx("coin");
  }
  stato.ripulite[stato.stanza] = true;
}

//  COMBATTIMENTO
// ============================================================
function iniziaCombattimento(chiaveNemico) {
  combattimento = NEMICI[chiaveNemico]();
  fxEnemy = fxShake = false;
  log(`⚔ Appare ${combattimento.nome}!`, "log-bad");
  schermataCombattimento();
}
function schermataCombattimento() {
  schermataAttuale = schermataCombattimento;
  const p = stato, n = combattimento, r = risorsa(p);
  const pozioni = p.inventario.filter(k => ITEMS[k].tipo === "pozione");
  app().innerHTML = `
    <div class="panel">${headerVitali()}</div>
    <div class="panel">
      <div class="sprite" id="enemySprite">${n.emoji}</div>
      <div class="combatant"><span class="name" style="color:#b04ab0">${n.nome}</span>
        <span class="tag">ATK ${n.attacco} DIF ${n.difesa}</span></div>
      <div class="bar-label"><span>PV</span><span>${n.pv}/${n.pvMax}</span></div>
      <div class="bar enemy"><div style="width:${100 * n.pv / n.pvMax}%"></div></div>
      ${(n.effetti && n.effetti.length) ? `<div style="margin-top:6px">${tagsEffetti(n)}</div>` : ""}
    </div>
    <div id="log"></div>
    <div class="panel">
      <div class="btn-grid">
        <button onclick="azioneAttacca()">🗡 Attacca</button>
        <button onclick="azioneAbilita()" ${p.mana < 5 ? "disabled" : ""}>✨ ${CLASSI[p.classe].abilita} (5)</button>
        <button onclick="azionePozione()" ${pozioni.length ? "" : "disabled"}>🧪 Pozione (${pozioni.length})</button>
        <button onclick="azioneDifendi()">🛡 Difenditi</button>
        <button class="danger" onclick="azioneFuga()">🏃 Fuggi</button>
      </div>
    </div>
  `;
  renderLog();
  if (fxEnemy) { const s = document.getElementById("enemySprite");
    if (s) { s.classList.add("lunge"); setTimeout(() => s && s.classList.remove("lunge"), 300); } }
  if (fxShake) { const a = app(); a.classList.add("shake"); setTimeout(() => a.classList.remove("shake"), 300); }
  fxEnemy = fxShake = false;
}
function eseguiTurno(actionFn) {
  const r = processoInizio(stato, "Tu");
  r.msg.forEach(m => log(m.t, m.c));
  if (stato.pv <= 0) return sconfitta();
  if (r.stordito) { fxShake = true; }
  else actionFn();
  if (combattimento.pv <= 0) return vittoria();
  faseNemico();
}
function faseNemico() {
  const n = combattimento, p = stato;
  const r = processoInizio(n, n.nome);
  r.msg.forEach(m => log(m.t, m.c));
  if (n.pv <= 0) return vittoria();
  if (!r.stordito) {
    let def = difesaTotale(p);
    if (p._guardia) def += Math.max(3, p.difesa);
    const base = n.attacco + rnd(-1, 2);
    const danno = Math.max(1, base - def);
    p.pv = Math.max(0, p.pv - danno);
    log(`${n.nome} ti colpisce per ${danno} danni.`, "log-bad");
    fxShake = true; sfx("hurt");
    if (n.inflitto && Math.random() < n.inflitto.prob) {
      applica(p, n.inflitto.tipo, n.inflitto.turni, n.inflitto.valore);
      log(`${n.nome} ti infligge ${NOMI_EFFETTO[n.inflitto.tipo]}!`, "log-bad");
    }
  }
  p._guardia = false;
  if (p.mana < p.manaMax) p.mana = Math.min(p.manaMax, p.mana + 1);
  if (p.pv <= 0) return sconfitta();
  schermataCombattimento();
}
function azioneAttacca() {
  eseguiTurno(() => {
    const p = stato, n = combattimento;
    const crit = p.classe === "Ladro" && Math.random() < 0.25;
    let base = attaccoTotale(p) + rnd(0, 3);
    if (crit) base = Math.floor(base * 1.8);
    const danno = Math.max(1, base - n.difesa);
    n.pv = Math.max(0, n.pv - danno);
    if (crit) { log(`COLPO CRITICO! Infliggi ${danno} danni.`, "log-crit"); sfx("crit"); }
    else { log(`Attacchi ${n.nome} per ${danno} danni.`); sfx("hit"); }
    fxEnemy = true;
    if (p.classe === "Ladro") applica(n, "veleno", 2, 2);
  });
}
function azioneAbilita() {
  eseguiTurno(() => {
    const p = stato, n = combattimento;
    if (p.mana < 5) { log(`${risorsa(p).nome} insufficiente!`, "log-bad"); return; }
    p.mana -= 5;
    const base = Math.floor(attaccoTotale(p) * CLASSI[p.classe].moltAbilita) + rnd(0, 4);
    const danno = Math.max(1, base - n.difesa);
    n.pv = Math.max(0, n.pv - danno);
    log(`Usi ${CLASSI[p.classe].abilita} e infliggi ${danno} danni!`, "log-crit");
    sfx("magic"); fxEnemy = true;
    if (p.classe === "Guerriero" && Math.random() < 0.45) { applica(n, "stordito", 1, 0); log(`${n.nome} è stordito!`, "log-sys"); }
    else if (p.classe === "Mago") { applica(n, "veleno", 3, 3); log(`${n.nome} prende fuoco!`, "log-sys"); }
    else if (p.classe === "Ladro") { applica(n, "veleno", 3, 3); }
  });
}
function azionePozione() {
  eseguiTurno(() => {
    const p = stato;
    const idx = p.inventario.findIndex(k => ITEMS[k].tipo === "pozione");
    if (idx === -1) { log("Niente pozioni!", "log-bad"); return; }
    const it = ITEMS[p.inventario[idx]]; const before = p.pv;
    p.pv = Math.min(p.pvMax, p.pv + it.cura);
    log(`Bevi ${it.nome} (+${p.pv - before} PV).`, "log-good"); sfx("heal");
    p.inventario.splice(idx, 1);
  });
}
function azioneDifendi() {
  eseguiTurno(() => { stato._guardia = true; log("Ti metti in guardia, pronto a parare."); });
}
function azioneFuga() {
  const n = combattimento;
  if (n.pvMax >= 70) { log(`${n.nome} ti blocca la via! Non puoi fuggire.`, "log-bad"); faseNemico(); return; }
  if (Math.random() < 0.6) {
    log("Riesci a fuggire!", "log-sys");
    const uscite = Object.values(MONDO[stato.stanza].uscite);
    if (uscite.length) stato.stanza = uscite[0];
    combattimento = null; entraStanza();
  } else { log("La fuga fallisce!", "log-bad"); faseNemico(); }
}
function vittoria() {
  const p = stato, n = combattimento;
  const boss = MONDO[p.stanza].boss;
  log(`Hai sconfitto ${n.nome}!`, "log-good");
  guadagnaXP(n.xp);
  const oro = Math.max(1, Math.floor(n.xp / 2));
  p.oro += oro; sfx("coin");
  log(`Raccogli ${oro} monete d'oro.`, "log-good");
  if (n.drop) { p.inventario.push(n.drop); log(`${n.nome} lascia: ${descBreve(ITEMS[n.drop])}!`, "log-good"); }
  p.effetti = [];
  combattimento = null;
  raccogliBottino();
  if (boss) { vittoriaFinale(); return; }
  schermataGioco();
}
function guadagnaXP(q) {
  const p = stato;
  log(`Guadagni ${q} punti esperienza.`);
  p.xp += q;
  while (p.xp >= p.xpProssimo) {
    p.xp -= p.xpProssimo; p.livello += 1; p.xpProssimo = Math.floor(p.xpProssimo * 1.5);
    p.pvMax += 6; p.manaMax += 3; p.attacco += 2; p.difesa += 1;
    p.pv = p.pvMax; p.mana = p.manaMax;
    log(`★ LIVELLO ${p.livello}! PV+6, ${risorsa(p).nome}+3, ATK+2, DIF+1. Recupero completo.`, "log-crit");
    sfx("level");
  }
}
function vittoriaFinale() {
  schermataAttuale = vittoriaFinale;
  stato.quest.principale = "completata";
  sfx("victory");
  app().innerHTML = `
    <h1 class="title pop">🏆 VITTORIA! 🏆</h1>
    <div class="panel">
      <div class="sprite pop">🐉💥</div>
      <p class="room-desc">Hai abbattuto il Drago Antico, ${stato.nome}!
      La cripta è liberata e il tuo nome diventa leggenda.</p>
      <div class="stats">
        <div>Livello finale: <span>${stato.livello}</span></div>
        <div>Oro raccolto: <span>${stato.oro}</span></div>
        <div>Missioni completate: <span>${Object.values(stato.quest).filter(s => s === "completata").length}/3</span></div>
      </div>
      <button class="primary" style="margin-top:14px" onclick="nuovaDaCapo()">Gioca di nuovo</button>
    </div>
  `;
  localStorage.removeItem(SAVE_KEY);
}
function sconfitta() {
  schermataAttuale = sconfitta;
  sfx("defeat");
  app().innerHTML = `
    <h1 class="title" style="color:var(--bad)">☠ SEI MORTO ☠</h1>
    <div class="panel">
      <div class="sprite">💀</div>
      <p class="room-desc">La tua avventura finisce qui... Le tue ossa si aggiungono
      a quelle della cripta.</p>
      <button class="primary" onclick="nuovaDaCapo()">Riprova</button>
    </div>
  `;
  localStorage.removeItem(SAVE_KEY);
}
function nuovaDaCapo() { location.reload(); }

// ============================================================
//  NPC, DIALOGHI E MISSIONI
// ============================================================
function interagisciNpc() {
  const npc = MONDO[stato.stanza].npc;
  if (npc === "anziano") parlaAnziano();
  else if (npc === "mercante") apriMercante();
  else if (npc === "prigioniero") parlaPrigioniero();
  else if (npc === "altare") usaAltare();
}
function schermataDialogo(emoji, titolo, righe, azioni) {
  app().innerHTML = `
    <div class="panel" style="margin-top:10px">
      <div class="sprite">${emoji}</div>
      <h2 class="room-name">${titolo}</h2>
      ${righe.map(r => `<p class="room-desc">${r}</p>`).join("")}
      <div id="dlgAzioni"></div>
    </div>
  `;
  const cont = document.getElementById("dlgAzioni");
  azioni.forEach(a => {
    const b = document.createElement("button");
    if (a.cls) b.className = a.cls;
    b.textContent = a.label; b.onclick = a.fn;
    cont.appendChild(b);
  });
}
function parlaAnziano() {
  schermataAttuale = parlaAnziano;
  const righe = [];
  if (stato.quest.principale === "non_iniziata") {
    stato.quest.principale = "attiva";
    righe.push("«Ascolta, eroe. In fondo a questa cripta dorme il Drago Antico. Solo abbattendolo libererai queste terre.»");
    righe.push("<i>Nuova missione: L'Ombra del Drago.</i>");
  } else if (stato.quest.principale === "completata") {
    righe.push("«Hai sconfitto il drago! Sei una leggenda vivente.»");
  } else {
    righe.push("«Il drago ti attende a nord, oltre la cripta. L'ingresso è sigillato: cerca chi possiede la chiave.»");
  }
  schermataDialogo("🧙‍♂️", "L'Anziano", righe, [{ label: "← Torna indietro", fn: schermataGioco }]);
}
function parlaPrigioniero() {
  schermataAttuale = parlaPrigioniero;
  if (stato.quest.prigioniero !== "completata") {
    stato.quest.prigioniero = "completata";
    stato.oro += 50;
    stato.inventario.push("lama");
    stato.inventario.push("chiave");
    sfx("coin");
    schermataDialogo("🧎", "Il Prigioniero", [
      "«Grazie, mi hai liberato! Ero un cacciatore di draghi... prendi la mia Lama del Cacciatore.»",
      "«E tieni questa: la Chiave del Drago. Senza, l'Antro resta sigillato da una barriera magica.»",
      "<i>Missione completata: Il Prigioniero. Ricevi 50 oro, la Lama del Cacciatore (+6 ATK) e la Chiave del Drago.</i>",
      "«Un consiglio: il drago è vulnerabile al fuoco e ai veleni persistenti.»",
    ], [{ label: "← Torna indietro", fn: schermataGioco }]);
  } else {
    schermataDialogo("🧎", "Il Prigioniero", [
      "«Ti devo la vita. Abbatti quel drago per entrambi!»",
    ], [{ label: "← Torna indietro", fn: schermataGioco }]);
  }
}
function usaAltare() {
  schermataAttuale = usaAltare;
  const before = stato.pv + stato.mana;
  stato.pv = stato.pvMax; stato.mana = stato.manaMax; stato.effetti = [];
  sfx("heal");
  schermataDialogo("✨", "Santuario", [
    before < stato.pvMax + stato.manaMax
      ? "Una luce calda ti avvolge. PV e risorsa ripristinati al massimo, effetti negativi rimossi."
      : "Riposi all'altare. Sei già in piena forma.",
  ], [{ label: "← Torna indietro", fn: schermataGioco }]);
}
function apriMercante() {
  schermataAttuale = apriMercante;
  const p = stato;
  if (p.quest.amuleto === "non_iniziata") { p.quest.amuleto = "attiva"; log("Nuova missione: L'Amuleto del Mercante.", "log-sys"); }
  const inVendita = ["pozMinore", "pozMaggiore", "antidoto", "spada", "pugnale", "ascia", "cuoio", "maglia", "mantello"];
  const haAmuleto = p.inventario.includes("amuleto");
  app().innerHTML = `
    <div class="panel" style="margin-top:10px">${headerVitali()}</div>
    <div class="panel">
      <div class="sprite">🧝</div>
      <h2 class="room-name">Il Mercante</h2>
      <p class="room-desc">«Benvenuto! Compra, vendi... e se trovi il mio Amuleto Perduto
      nella stanza segreta, sarò molto generoso.»</p>
      ${haAmuleto && p.quest.amuleto === "attiva"
        ? `<button class="primary" onclick="consegnaAmuleto()">🎁 Consegna l'Amuleto Perduto</button>` : ""}
      <h3 style="color:var(--accent)">Acquista</h3><div id="shopBuy"></div>
      <h3 style="color:var(--accent); margin-top:10px">Vendi (metà prezzo)</h3><div id="shopSell"></div>
      <button style="margin-top:12px" onclick="schermataGioco()">← Esci dal mercato</button>
    </div>
  `;
  const buy = document.getElementById("shopBuy");
  inVendita.forEach(k => {
    const it = ITEMS[k], prezzo = it.valore;
    const row = document.createElement("div"); row.className = "item-row";
    row.innerHTML = `<span>${descBreve(it)} — <span class="vital oro">🪙 ${prezzo}</span></span>`;
    const b = document.createElement("button"); b.className = "small"; b.textContent = "Compra";
    b.disabled = p.oro < prezzo;
    b.onclick = () => { p.oro -= prezzo; p.inventario.push(k); sfx("coin"); apriMercante(); };
    row.appendChild(b); buy.appendChild(row);
  });
  const sell = document.getElementById("shopSell");
  const vendibili = p.inventario.filter(k => ITEMS[k].tipo !== "tesoro");
  if (!vendibili.length) { sell.innerHTML = `<p class="room-desc">Non hai nulla da vendere.</p>`; }
  else p.inventario.forEach((k, i) => {
    const it = ITEMS[k];
    if (it.tipo === "tesoro") return;
    const prezzo = Math.floor(it.valore / 2);
    const row = document.createElement("div"); row.className = "item-row";
    row.innerHTML = `<span>${descBreve(it)} — <span class="vital oro">🪙 ${prezzo}</span></span>`;
    const b = document.createElement("button"); b.className = "small"; b.textContent = "Vendi";
    b.onclick = () => {
      p.oro += prezzo;
      if (p.arma === k) p.arma = null;
      if (p.armatura === k) p.armatura = null;
      p.inventario.splice(i, 1); sfx("coin"); apriMercante();
    };
    row.appendChild(b); sell.appendChild(row);
  });
}
function consegnaAmuleto() {
  const p = stato;
  const idx = p.inventario.indexOf("amuleto");
  if (idx === -1) return;
  p.inventario.splice(idx, 1);
  p.quest.amuleto = "completata";
  p.oro += 70; p.inventario.push("mantello"); sfx("coin");
  schermataDialogo("🧝", "Il Mercante", [
    "«Il mio amuleto! Te ne sarò eternamente grato. Prendi questo Mantello Arcano e dell'oro.»",
    "<i>Missione completata: L'Amuleto del Mercante. Ricevi 70 oro e il Mantello Arcano (+5 DIF).</i>",
  ], [{ label: "← Torna indietro", fn: schermataGioco }]);
}

// ============================================================
//  SALVATAGGIO
// ============================================================
function salvaPartita() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(stato));
  log("Partita salvata nel browser.", "log-sys");
  tabAttiva = "esplora"; schermataGioco();
}
function caricaPartita() {
  const dati = localStorage.getItem(SAVE_KEY);
  if (!dati) { schermataMenu(); return; }
  try {
    stato = JSON.parse(dati);
    stato.effetti = stato.effetti || [];
    stato.visitate = stato.visitate || {};
    stato.quest = stato.quest || { principale: "non_iniziata", amuleto: "non_iniziata", prigioniero: "non_iniziata" };
    logBuffer = []; tabAttiva = "esplora"; saccaAperta = null;
    log(`Bentornato, ${stato.nome}!`, "log-sys");
    entraStanza();
  } catch (e) { schermataMenu(); }
}
function abbandona() {
  if (confirm("Tornare al menu? Salva prima se non vuoi perdere i progressi.")) schermataMenu();
}

// Avvio.
schermataMenu();
</script>
</body>
</html>
